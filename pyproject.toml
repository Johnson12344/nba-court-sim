[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-local-sim"
version = "0.6.1"
description = "Transparent local NBA possession simulation and analytics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "requests>=2.31,<3",
  "nba_api>=1.4,<2",
  "rich>=13.7,<15",
  "PyYAML>=6.0,<7",
  "pypdf>=6.1,<7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
nba-sim = "nba_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

